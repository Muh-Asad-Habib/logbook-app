<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Logbook</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fb; color: #1e1f36; }
    @media (prefers-color-scheme: dark) { body { background: #0d0f22; color: #e6e8ff; } }
    .kartu { text-align: center; padding: 36px 28px; border-radius: 22px; max-width: 380px;
      background: rgba(255,255,255,.75); box-shadow: 0 18px 50px -20px rgba(79,70,229,.35); }
    @media (prefers-color-scheme: dark) { .kartu { background: rgba(30,32,60,.8); } }
    .ic { font-size: 3rem; line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 18px; opacity: .8; font-size: .92rem; line-height: 1.5; }
    button { border: none; border-radius: 12px; padding: 11px 20px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; font-size: .9rem; }
    button:focus-visible { outline: 3px solid rgba(79,70,229,.45); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="kartu" role="status">
    <div class="ic" aria-hidden="true">📡</div>
    <h1>Kamu sedang offline</h1>
    <p>Logbook membutuhkan koneksi internet untuk memuat data terbaru.
       Sambungkan kembali, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
