<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" fill="none" role="img" aria-label="Langit malam dengan planet, buku logbook, dan pegunungan">
  <!-- ===== bintang ===== -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="2" opacity=".7"/><circle cx="220" cy="140" r="1.6" opacity=".5"/>
    <circle cx="340" cy="50" r="2.2" opacity=".8"/><circle cx="520" cy="110" r="1.5" opacity=".45"/>
    <circle cx="640" cy="40" r="2" opacity=".6"/><circle cx="760" cy="150" r="1.6" opacity=".5"/>
    <circle cx="880" cy="60" r="2.4" opacity=".8"/><circle cx="1030" cy="130" r="1.5" opacity=".5"/>
    <circle cx="1120" cy="40" r="2" opacity=".65"/><circle cx="1260" cy="120" r="1.7" opacity=".5"/>
    <circle cx="1420" cy="60" r="2.2" opacity=".75"/><circle cx="1530" cy="150" r="1.6" opacity=".5"/>
    <circle cx="160" cy="230" r="1.5" opacity=".4"/><circle cx="460" cy="210" r="1.6" opacity=".45"/>
    <circle cx="720" cy="240" r="1.5" opacity=".4"/><circle cx="1330" cy="230" r="1.6" opacity=".45"/>
  </g>
  <path d="M300 90l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" fill="#7fe3d2" opacity=".85"/>
  <path d="M1470 190l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" fill="#aab6ff" opacity=".8"/>
  <path d="M960 190l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#ffc766" opacity=".8"/>

  <!-- ===== planet cincin (indigo) ===== -->
  <g transform="translate(190 130)">
    <circle r="40" fill="#6366f1"/>
    <path d="M-40 0a40 40 0 0 0 80 0c-14 10-26 14-40 14S-26 10-40 0z" fill="#4f46e5"/>
    <circle cx="-12" cy="-14" r="7" fill="#818cf8"/>
    <circle cx="14" cy="6" r="5" fill="#818cf8" opacity=".8"/>
    <ellipse rx="64" ry="14" transform="rotate(-16)" stroke="#aab6ff" stroke-width="5" opacity=".65"/>
  </g>

  <!-- ===== planet merah kecil (ala referensi) ===== -->
  <g transform="translate(1395 165)">
    <circle r="24" fill="#e2606b"/>
    <circle cx="-7" cy="-6" r="5" fill="#c94b58"/>
    <circle cx="9" cy="8" r="4" fill="#c94b58"/>
    <circle cx="6" cy="-10" r="2.5" fill="#f28d95"/>
  </g>

  <!-- ===== planet koin Rp (keuangan) ===== -->
  <g transform="translate(1180 85)">
    <ellipse rx="34" ry="9" transform="rotate(-12)" stroke="#ffd894" stroke-width="3.5" opacity=".7"/>
    <circle r="19" fill="#ffc766"/>
    <circle r="13.5" fill="#ffd894"/>
    <text y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#8a5a13">Rp</text>
  </g>

  <!-- ===== buku logbook melayang (kegiatan) ===== -->
  <g transform="translate(450 165) rotate(-8)">
    <path d="M0 0c-20-10-48-12-64-8v64c16-4 44-2 64 8z" fill="#ffffff"/>
    <path d="M0 0c20-10 48-12 64-8v64c-16-4-44-2-64 8z" fill="#e9eefb"/>
    <path d="M0 0v64" stroke="#c7d2fe" stroke-width="2.5"/>
    <rect x="-52" y="10" width="7" height="7" rx="2" fill="#34d399"/>
    <rect x="-41" y="11.5" width="28" height="4" rx="2" fill="#c3cdec"/>
    <rect x="-52" y="24" width="7" height="7" rx="2" fill="#ffc766"/>
    <rect x="-41" y="25.5" width="24" height="4" rx="2" fill="#c3cdec"/>
    <rect x="10" y="26" width="8" height="18" rx="2.5" fill="#7fe3d2"/>
    <rect x="22" y="18" width="8" height="26" rx="2.5" fill="#94a3ff"/>
    <rect x="34" y="9" width="8" height="35" rx="2.5" fill="#ffc766"/>
  </g>

  <!-- ===== dokumen laporan melayang ===== -->
  <g transform="translate(935 105) rotate(9)">
    <rect x="-26" y="-34" width="52" height="68" rx="8" fill="#ffffff"/>
    <rect x="-17" y="-23" width="26" height="5" rx="2.5" fill="#94a3ff"/>
    <rect x="-17" y="-12" width="34" height="4" rx="2" fill="#dbe3f0"/>
    <rect x="-17" y="-3" width="30" height="4" rx="2" fill="#dbe3f0"/>
    <rect x="-17" y="6" width="34" height="4" rx="2" fill="#dbe3f0"/>
    <circle cx="12" cy="22" r="8.5" fill="#34d399"/>
    <path d="M8 22l3 3 6-6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== cahaya bulan di balik gunung ===== -->
  <circle cx="810" cy="330" r="120" fill="#7fe3d2" opacity=".12"/>

  <!-- ===== gunung belakang (teal) + puncak mint ===== -->
  <path d="M0 430 L140 345 L260 402 L420 300 L560 400 L720 342 L860 410 L1040 318 L1200 404 L1360 352 L1600 428 L1600 620 L0 620 Z" fill="#123f4d"/>
  <path d="M395 318 L420 300 L445 318 L433 312 L420 323 L407 312 Z" fill="#cfeee8" opacity=".92"/>
  <path d="M1016 336 L1040 318 L1064 336 L1052 330 L1040 341 L1028 330 Z" fill="#cfeee8" opacity=".92"/>

  <!-- ===== bukit tengah ===== -->
  <path d="M0 500 C160 442 300 472 460 456 C640 438 760 482 940 462 C1120 444 1280 482 1600 452 L1600 620 L0 620 Z" fill="#0e5560"/>

  <!-- ===== dedaunan tepi (ala Login_3 terang) ===== -->
  <g fill="#157a66">
    <path d="M60 620 C10 540 20 460 78 405 C92 480 84 560 60 620 Z"/>
    <path d="M120 620 C90 560 96 500 140 458 C150 515 142 575 120 620 Z" opacity=".85"/>
    <path d="M16 620 C-6 570 -2 520 28 486 C38 534 32 585 16 620 Z" opacity=".7"/>
  </g>
  <g fill="#157a66" transform="translate(1600 0) scale(-1 1)">
    <path d="M60 620 C10 540 20 460 78 405 C92 480 84 560 60 620 Z"/>
    <path d="M120 620 C90 560 96 500 140 458 C150 515 142 575 120 620 Z" opacity=".85"/>
    <path d="M16 620 C-6 570 -2 520 28 486 C38 534 32 585 16 620 Z" opacity=".7"/>
  </g>

  <!-- ===== ombak depan (navy) ===== -->
  <path d="M0 560 C220 516 420 546 640 536 C880 524 1080 556 1290 541 C1420 532 1520 546 1600 539 L1600 620 L0 620 Z" fill="#0b1b2c"/>
